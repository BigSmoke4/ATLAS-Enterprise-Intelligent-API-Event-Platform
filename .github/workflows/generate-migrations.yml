name: Generate EF migrations

# Migrations are generated artefacts: they are produced by the EF tooling from
# the current model, reviewed, and committed — never hand-written. This workflow
# exists so the reviewed baseline can be regenerated on a machine that has the
# .NET SDK and `dotnet-ef`, and pushed straight back to the branch that asked
# for it. It is manual by design: it never runs on a push, and it never touches
# a branch other than the one it was dispatched from.
on:
  # Dispatching by name requires the workflow to exist on the default branch.
  # Until this file lands on `main`, a push that changes it on any other branch
  # runs it for that branch — which is exactly what a first-generation pass
  # needs. The path filter keeps later pushes (for example the commit this job
  # itself creates) from re-triggering it.
  push:
    paths:
      - '.github/workflows/generate-migrations.yml'
  workflow_dispatch:
    inputs:
      migration_name:
        description: Migration name to generate once per DbContext
        required: true
        default: ModelSync

permissions:
  contents: write

jobs:
  generate:
    # Never on main. This job *commits and pushes* generated migrations, so it
    # belongs to the branch that asked for them; on main the same regeneration
    # arrives through a reviewed pull request and is gated by CI's model-drift
    # step. Without this guard, merging the workflow file into main would arm an
    # auto-committing bot against the release branch.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch this workflow was dispatched from
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ATLAS.sln

      - name: Install EF tooling
        # Pinned to the runtime's major/minor: CI's drift check installs 9.0.1,
        # and migrations generated by a different tool version are not
        # guaranteed to match what that check produces. The tools directory is
        # added to PATH the same way ci.yml does it — without that, `dotnet ef`
        # is not a command and the next step fails with no explanation.
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate migrations for every module DbContext
        # The fallback is the name a path-triggered run (the one that regenerates
        # a reviewed model delta) uses; a dispatch can override it.
        #
        # The output is captured and republished as annotations on failure: the
        # runner log is not readable without repository access, and this step is
        # the one that failed without saying why on 2026-10-05. Every other step
        # in this workflow already reports its own diagnostics — this one should
        # not be the exception.
        run: |
          set -uo pipefail
          if ! scripts/add-migration.sh "${{ inputs.migration_name || 'ModelSync' }}" > generation.log 2>&1; then
            echo "::error::migration generation failed; the last 40 lines of its output follow"
            tail -n 40 generation.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              echo "::error::add-migration: ${line}"
            done
            exit 1
          fi
          tail -n 20 generation.log
        env:
          # The design-time host boots Program.cs, so each module must find the
          # configuration keys it requires. No server needs to be reachable:
          # `migrations add` builds the model, it does not open a connection.
          ConnectionStrings__Postgres: "Host=localhost;Database=atlas_design;Username=atlas;Password=atlas_design"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Commit and push the generated migrations
        run: |
          set -uo pipefail
          git config user.name "atlas-migrations[bot]"
          git config user.email "atlas-migrations[bot]@users.noreply.github.com"

          # The runner log is the only channel available to a maintainer without
          # write access to the repository, and only workflow commands
          # (::warning:: / ::error::) survive as annotations. Every command that
          # can fail therefore reports its own exit code and output, aggregated
          # into a single annotation so a failure is diagnosable from the run page.
          GENERATED=$(find src/Modules -path '*Migrations*' -name '*.cs' | wc -l)
          echo "::warning::generated migration files: ${GENERATED}"
          if [ "${GENERATED}" -eq 0 ]; then
            echo "::error::the generation step produced no migration files"
            exit 1
          fi

          git add -A src/Modules; ADD_EXIT=$?
          echo "::warning::git add exit ${ADD_EXIT}: $(git status --porcelain src/Modules | head -40 | tr '\n' ';' | cut -c1-1200)"
          if [ "${ADD_EXIT}" -ne 0 ]; then
            echo "::error::git add failed with exit code ${ADD_EXIT}"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "::warning::nothing was staged -- the working tree already matches the committed migrations"
            exit 0
          fi

          git commit -m "Add generated EF Core migrations (${{ inputs.migration_name || 'ModelSync' }})"; COMMIT_EXIT=$?
          echo "::warning::git commit exit ${COMMIT_EXIT}: $(git log --oneline -1)"
          if [ "${COMMIT_EXIT}" -ne 0 ]; then
            echo "::error::git commit failed with exit code ${COMMIT_EXIT}"
            exit 1
          fi

          # The branch can move while a generation run is in flight, so replay
          # the commit on top of the newest tip before pushing.
          git fetch origin "${BRANCH}"; FETCH_EXIT=$?
          if [ "${FETCH_EXIT}" -ne 0 ]; then
            echo "::error::git fetch of ${BRANCH} failed with exit code ${FETCH_EXIT}"
            exit 1
          fi

          git rebase "origin/${BRANCH}"; REBASE_EXIT=$?
          if [ "${REBASE_EXIT}" -ne 0 ]; then
            git rebase --abort >/dev/null 2>&1 || true
            echo "::error::git rebase onto origin/${BRANCH} failed with exit code ${REBASE_EXIT}"
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"; PUSH_EXIT=$?
          if [ "${PUSH_EXIT}" -ne 0 ]; then
            echo "::error::git push to ${BRANCH} failed with exit code ${PUSH_EXIT}"
            exit 1
          fi
          echo "::notice::pushed $(git rev-parse --short HEAD) to ${BRANCH}"
        env:
          BRANCH: ${{ github.ref_name }}
