name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports: ["2181:2181"]
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ATLAS.sln

      - name: Build
        run: dotnet build ATLAS.sln --no-restore -c Release

      - name: Static analysis
        run: dotnet build ATLAS.sln --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Atlas.UnitTests/Atlas.UnitTests.csproj --no-build -c Release

      - name: Architecture tests
        run: dotnet test tests/Atlas.ArchitectureTests/Atlas.ArchitectureTests.csproj --no-build -c Release

      - name: Dependency security audit
        run: dotnet list ATLAS.sln package --vulnerable --include-transitive

      - name: Integration tests
        run: dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Docker build
        run: docker build -t atlas-web:ci .
