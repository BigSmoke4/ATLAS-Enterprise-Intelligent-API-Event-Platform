name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports: ["2181:2181"]
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ATLAS.sln

      - name: Build
        run: dotnet build ATLAS.sln --no-restore -c Release

      - name: Static analysis
        run: |
          set -o pipefail
          dotnet build ATLAS.sln --no-restore -c Release -warnaserror 2>&1 | tee static-analysis.log

      - name: Unit tests
        run: |
          set -o pipefail
          dotnet test tests/Atlas.UnitTests/Atlas.UnitTests.csproj --no-build -c Release 2>&1 | tee unit-tests.log

      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate and apply disposable CI schema
        run: |
          set -o pipefail
          scripts/add-migration.sh CiBaseline 2>&1 | tee migration-generation.log
          scripts/migrate.sh 2>&1 | tee migration-application.log
        env:
          # dotnet-ef boots the full design-time host (Program.cs), so every
          # module's RegisterServices must find its configuration here:
          # Postgres for the EF modules, Redis for Reliability, Kafka for
          # EventPlatform. Without these the host factory throws before EF
          # tooling can even locate the DbContexts.
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Model drift check (checked-in migrations match the EF model)
        run: |
          set -o pipefail
          # `migrations add` always succeeds: if the model matches the committed
          # snapshot the new migration is empty. An empty migration is the pass
          # condition — any schema operation means the committed migration (and
          # its snapshot) is behind the model, which must fail the build rather
          # than ship an unreviewed schema.
          drift=0
          for file in $(find src/Modules -path '*Migrations*' -name '*_CiBaseline.cs'); do
            if grep -q 'migrationBuilder\.' "$file"; then
              echo "::error file=$file::contains schema operations — the checked-in migration/snapshot is behind the model"
              drift=1
            else
              echo "no drift: $file"
            fi
          done
          if [ "$drift" -ne 0 ]; then exit 1; fi
          echo "All eleven module models match their checked-in migrations."

      - name: Architecture tests
        run: |
          set -o pipefail
          dotnet test tests/Atlas.ArchitectureTests/Atlas.ArchitectureTests.csproj --no-build -c Release --logger "console;verbosity=detailed" 2>&1 | tee architecture-tests.log

      - name: Dependency security audit (advisory)
        continue-on-error: true
        run: dotnet list ATLAS.sln package --vulnerable --include-transitive

      - name: Wait for integration dependencies
        run: |
          set -euo pipefail
          for endpoint in 6379 9092; do
            for attempt in $(seq 1 30); do
              if (echo > /dev/tcp/localhost/$endpoint) >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Dependency port $endpoint did not become reachable."
                exit 1
              fi
              sleep 2
            done
          done

      - name: Integration tests - anonymous protected API rejection
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~AuthorizationPipelineTests" --logger "console;verbosity=detailed" --results-directory TestResults/anonymous-api 2>&1 | tee integration-anonymous-api.log

      - name: Integration tests - anonymous liveness
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~AuthorizationPipelineTests.Liveness_is_available_without_authentication" --logger "console;verbosity=detailed" --results-directory TestResults/anonymous-liveness 2>&1 | tee integration-anonymous-liveness.log

      - name: Integration tests - authenticated authorization
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~AuthenticatedAuthorizationTests" --logger "console;verbosity=detailed" --results-directory TestResults/authenticated-authorization 2>&1 | tee integration-authenticated-authorization.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - MVC page authorization
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~MvcPageAuthorizationTests" --logger "console;verbosity=detailed" --results-directory TestResults/mvc-pages 2>&1 | tee integration-mvc-pages.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - console page render
        run: |
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~ConsolePageRenderTests" --logger "console;verbosity=detailed" --results-directory TestResults/console-pages > integration-console-pages.log 2>&1 || true
          # Surface the failure lines as annotations: a page that renders an
          # error body must not be diagnosable only from an uploaded artifact.
          grep -n -E "Failed |Error Message|Assert\.|Expected:|Actual:|Stack Trace" integration-console-pages.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          tail -3 integration-console-pages.log
          if grep -q "Failed!" integration-console-pages.log; then exit 1; fi
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - audit HTTP
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~AuditEndpointIntegrationTests" --logger "console;verbosity=detailed" --results-directory TestResults/audit 2>&1 | tee integration-audit.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - readiness
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~ReadinessTests" --logger "console;verbosity=detailed" --results-directory TestResults/readiness 2>&1 | tee integration-readiness.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - Redis
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~RedisRateLimitIntegrationTests" --logger "console;verbosity=detailed" --results-directory TestResults/redis 2>&1 | tee integration-redis.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Integration tests - Kafka
        run: |
          set -o pipefail
          dotnet test tests/Atlas.IntegrationTests/Atlas.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~KafkaEventIntegrationTests" --logger "console;verbosity=detailed" --results-directory TestResults/kafka 2>&1 | tee integration-kafka.log
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
          ConnectionStrings__Redis: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"

      - name: Upload integration test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            TestResults
            integration-*.log
            migration-*.log
            unit-tests.log
            architecture-tests.log
            static-analysis.log
          if-no-files-found: ignore

      - name: CI failure diagnostics
        if: failure()
        run: |
          # GH shells run with -eo pipefail, which would abort this step on the
          # first log that contains no matching lines — explicitly disable it.
          set +e
          shopt -s nullglob
          for f in static-analysis.log unit-tests.log architecture-tests.log migration-generation.log migration-application.log integration-*.log; do
            echo "===== $f (tail) =====" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Surface xunit failure blocks (Error Message + body + first
            # stack lines) as check-run annotations so the failing
            # assertion is inspectable through the Checks API without
            # downloading artifacts. % and CR must be escaped or the
            # workflow command parser mangles the line.
            awk '/Error Message:/{f=1;c=0} f{print;c++} c>16{f=0}' "$f" | tail -n 60 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  line="${line//$'\r'/'%0D'}"
                  line="${line//'['/}"; line="${line//']'/}"
                  echo "::error::$f: $line"
                done
            grep -aEi "error|failed|exception|Expected:|Actual:|Unable|denied|refused|invalid" "$f" \
              | grep -aEv "0 Warning|0 Error|Passed!" | tail -n 25 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  line="${line//$'\r'/'%0D'}"
                  echo "::error::$f: $line"
                done
          done
          exit 0

      - name: Docker build
        run: docker build -t atlas-web:ci .

      - name: Docker smoke test
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=atlas_ci;Username=atlas;Password=atlas_ci"
        run: |
          set -euo pipefail
          docker run -d --name atlas-web-ci --network host \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ConnectionStrings__Postgres="$POSTGRES_CONNECTION" \
            -e ConnectionStrings__Redis=localhost:6379 \
            -e Kafka__BootstrapServers=localhost:9092 \
            atlas-web:ci
          trap 'docker logs atlas-web-ci || true; docker rm -f atlas-web-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if ATLAS_BASE_URL=http://localhost:8080 scripts/smoke.sh; then
              exit 0
            fi
            sleep 2
          done
          echo "Container smoke test did not become healthy in time."
          exit 1
