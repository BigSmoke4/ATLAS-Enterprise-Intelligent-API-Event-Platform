version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["5432:5432"]
    volumes: ["atlas_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: atlas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Infrastructure exporters. The platform's own /metrics covers what ATLAS
  # does; these cover what it runs on. Grafana's Postgres/Redis/Kafka panels
  # read them, and they are deliberately separate containers so a database or
  # broker tuning change does not require rebuilding the application image.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    depends_on: [postgres]
    ports: ["9187:9187"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-atlas}?sslmode=disable"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0-alpine
    depends_on: [redis]
    ports: ["9121:9121"]
    environment:
      REDIS_ADDR: "redis://redis:6379"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on: [kafka]
    ports: ["9308:9308"]
    command: ["--kafka.server=kafka:29092"]

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on: [atlas-web, postgres-exporter, redis-exporter, kafka-exporter]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  atlas-web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [postgres, redis, kafka]
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-atlas};Username=${POSTGRES_USER:-atlas};Password=${POSTGRES_PASSWORD:?set in .env}"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      ASPNETCORE_ENVIRONMENT: "Development"

volumes:
  atlas_postgres_data:
